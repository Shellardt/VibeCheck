<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vibe Check · Curated Cafe Solo Raya</title>
  <!-- Bootstrap 5 + Icons + Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #f4f7fc;
      transition: background 0.3s, color 0.2s;
      padding-bottom: 80px;
    }
    body.dark-mode {
      background: #0f172a;
      color: #eef2ff;
    }
    body.dark-mode .card, body.dark-mode .bento-card, body.dark-mode .modal-content {
      background: rgba(30, 41, 59, 0.85) !important;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      color: #f1f5f9;
    }
    body.dark-mode .vibe-filter {
      background: rgba(30, 41, 59, 0.7) !important;
    }
    body.dark-mode .bottom-nav {
      background: rgba(30, 41, 59, 0.95) !important;
      backdrop-filter: blur(20px);
    }
    .card, .bento-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      border: 1px solid rgba(255,255,255,0.5);
      transition: transform 0.2s ease, box-shadow 0.2s;
    }
    .vibe-filter {
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 60px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(4px);
      font-weight: 600;
    }
    .vibe-filter.active {
      background: #2b3b2c;
      color: white;
    }
    .btn-electric {
      background: #1e5af7;
      border: none;
      border-radius: 40px;
      padding: 12px 24px;
      font-weight: 600;
      color: white;
      transition: 0.2s;
    }
    .btn-electric:hover {
      background: #0a44cc;
      transform: scale(0.97);
    }
    .btn-outline-electric {
      border: 1.5px solid #1e5af7;
      border-radius: 40px;
      background: transparent;
      color: #1e5af7;
      font-weight: 600;
    }
    .cafe-card {
      cursor: pointer;
      transition: all 0.2s;
    }
    .cafe-card.selected {
      border: 2px solid #1e5af7;
      background: rgba(30, 90, 247, 0.1);
    }
    .cafe-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 20px;
    }
    .like-btn {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .like-btn:hover {
      transform: scale(1.1);
    }
    .like-btn.liked {
      color: #ff4757;
    }
    .toast-custom {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1090;
      background: #1e293b;
      color: white;
      border-radius: 60px;
      padding: 10px 20px;
      font-weight: 500;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
    }
    .screen {
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0,0,0,0.05);
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    body.dark-mode .bottom-nav {
      background: rgba(30, 41, 59, 0.95);
      border-top-color: rgba(255,255,255,0.1);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: 0.2s;
      opacity: 0.6;
    }
    .nav-item.active {
      opacity: 1;
      color: #1e5af7;
    }
    .nav-item i {
      font-size: 24px;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 600;
    }
    .history-card {
      border-left: 4px solid #1e5af7;
    }
    .badge-vibe {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .maps-link {
      text-decoration: none;
      font-size: 14px;
    }
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
  </style>
</head>
<body>

<div id="app" style="max-width: 600px; margin: auto; position: relative;">
  <!-- Auth Screens -->
  <div id="loginScreen" class="screen"></div>
  <div id="registerScreen" class="screen d-none"></div>
  
  <!-- Main App Screens (with bottom nav) -->
  <div id="mainAppContainer" class="d-none">
    <div class="container py-3" style="padding-bottom: 20px;">
      <div id="homeScreen" class="screen"></div>
      <div id="likesScreen" class="screen d-none"></div>
      <div id="historyScreen" class="screen d-none"></div>
      <div id="profileScreen" class="screen d-none"></div>
      <div id="cafeDetailScreen" class="screen d-none"></div>
    </div>
    
    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item" data-nav="home">
        <i class="bi bi-house-door-fill"></i>
        <span>Home</span>
      </div>
      <div class="nav-item" data-nav="likes">
        <i class="bi bi-heart-fill"></i>
        <span>Like</span>
      </div>
      <div class="nav-item" data-nav="history">
        <i class="bi bi-clock-history"></i>
        <span>History</span>
      </div>
      <div class="nav-item" data-nav="profile">
        <i class="bi bi-person-fill"></i>
        <span>Profile</span>
      </div>
    </div>
  </div>
</div>

  // Helper functions
  function simpleHash(pw) {
    let hash = 0;
    for (let i = 0; i < pw.length; i++) {
      hash = ((hash << 5) - hash) + pw.charCodeAt(i);
      hash |= 0;
    }
    return hash.toString(16);
  }

  function showToast(msg) {
    const toast = document.getElementById('globalToast');
    toast.innerText = msg;
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 2000);
  }

  function showMainApp() {
    document.getElementById('mainAppContainer').classList.remove('d-none');
    document.getElementById('loginScreen').classList.add('d-none');
    document.getElementById('registerScreen').classList.add('d-none');
  }

  function showLogin() {
    document.getElementById('mainAppContainer').classList.add('d-none');
    document.getElementById('loginScreen').classList.remove('d-none');
    document.getElementById('registerScreen').classList.add('d-none');
    renderLogin();
  }

  function showRegister() {
    document.getElementById('mainAppContainer').classList.add('d-none');
    document.getElementById('loginScreen').classList.add('d-none');
    document.getElementById('registerScreen').classList.remove('d-none');
    renderRegister();
  }

  function showScreen(screenId) {
    document.querySelectorAll('#mainAppContainer .screen').forEach(s => s.classList.add('d-none'));
    document.getElementById(screenId).classList.remove('d-none');
    
    // Update bottom nav active state
    const navMap = { homeScreen: 'home', likesScreen: 'likes', historyScreen: 'history', profileScreen: 'profile' };
    const activeNav = navMap[screenId];
    document.querySelectorAll('.nav-item').forEach(item => {
      if (item.dataset.nav === activeNav) item.classList.add('active');
      else item.classList.remove('active');
    });
  }

  // ==================== USER MANAGEMENT ====================
  function initUsers() {
    let users = localStorage.getItem(STORAGE_USERS);
    if (!users) {
      const defaultUsers = [
        { id: "1", name: "Vibester", email: "vibecheck@gmail.com", passwordHash: simpleHash("vibe123"), vibeStats: { nugas: 0, deepTalk: 0, party: 0 } }
      ];
      localStorage.setItem(STORAGE_USERS, JSON.stringify(defaultUsers));
    }
  }

  function getCurrentUser() {
    const session = localStorage.getItem(STORAGE_SESSION);
    if (!session) return null;
    try {
      const { userId } = JSON.parse(session);
      const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "[]");
      return users.find(u => u.id === userId) || null;
    } catch(e) { return null; }
  }

  function saveSession(user) {
    localStorage.setItem(STORAGE_SESSION, JSON.stringify({ userId: user.id, email: user.email, name: user.name }));
  }

  function clearSession() {
    localStorage.removeItem(STORAGE_SESSION);
  }

  function updateUser(updatedUser) {
    let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "[]");
    const idx = users.findIndex(u => u.id === updatedUser.id);
    if(idx !== -1) users[idx] = updatedUser;
    localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
    const session = localStorage.getItem(STORAGE_SESSION);
    if(session) {
      const sess = JSON.parse(session);
      if(sess.userId === updatedUser.id) saveSession(updatedUser);
    }
  }

  // ==================== LIKES & HISTORY ====================
  function getLikedCafes() {
    const likes = localStorage.getItem(STORAGE_LIKES + "_" + currentUser?.id);
    return likes ? JSON.parse(likes) : [];
  }

  function toggleLike(cafeId) {
    let likes = getLikedCafes();
    if (likes.includes(cafeId)) {
      likes = likes.filter(id => id !== cafeId);
      showToast("❤️ Dihapus dari favorit");
    } else {
      likes.push(cafeId);
      showToast("👍 Ditambahkan ke favorit");
    }
    localStorage.setItem(STORAGE_LIKES + "_" + currentUser.id, JSON.stringify(likes));
    return likes;
  }

  function isLiked(cafeId) {
    return getLikedCafes().includes(cafeId);
  }

  function addToHistory(billData) {
    let history = JSON.parse(localStorage.getItem(STORAGE_HISTORY + "_" + currentUser?.id) || "[]");
    history.unshift({ ...billData, id: Date.now(), date: new Date().toLocaleString() });
    if (history.length > 20) history.pop();
    localStorage.setItem(STORAGE_HISTORY + "_" + currentUser.id, JSON.stringify(history));
  }

  function getHistory() {
    return JSON.parse(localStorage.getItem(STORAGE_HISTORY + "_" + currentUser?.id) || "[]");
  }

  // ==================== GLOBAL STATE ====================
  let currentUser = null;
  let activeMoodFilter = "nugas";
  let selectedCafe = null;
  let cartItems = [];

  function loadUserPrefs() {
    if(!currentUser) return;
    const prefs = localStorage.getItem(STORAGE_PREFS + "_" + currentUser.id);
    if(prefs) {
      try {
        const p = JSON.parse(prefs);
        activeMoodFilter = p.activeMoodFilter || "nugas";
        if(p.selectedCafeId) {
          selectedCafe = cafesData.find(c => c.id === p.selectedCafeId);
        }
        cartItems = p.cartItems || [];
        if(p.darkMode) document.body.classList.add('dark-mode');
        else document.body.classList.remove('dark-mode');
      } catch(e) {}
    }
  }

  function savePrefs() {
    if(!currentUser) return;
    const darkMode = document.body.classList.contains('dark-mode');
    const prefs = { activeMoodFilter, selectedCafeId: selectedCafe?.id || null, cartItems, darkMode };
    localStorage.setItem(STORAGE_PREFS + "_" + currentUser.id, JSON.stringify(prefs));
  }

  // ==================== RENDER LOGIN ====================
  function renderLogin() {
    const container = document.getElementById('loginScreen');
    container.innerHTML = `
      <div class="auth-container">
        <div class="card p-4 w-100 border-0" style="border-radius: 48px;">
          <h2 class="fw-bold mb-1">Vibe Check</h2>
          <p class="text-secondary">Cafe curator for Solo Raya ✨</p>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control rounded-pill" id="loginEmail" placeholder="vibe@check.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control rounded-pill" id="loginPassword" required>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label">Remember Me</label>
            </div>
            <button type="submit" class="btn-electric w-100">Login & vibe ➡</button>
            <p class="text-center mt-3">Belum punya akun? <a href="#" id="gotoRegisterBtn" class="text-decoration-none fw-bold">Daftar Sekarang</a></p>
          </form>
        </div>
      </div>
    `;
    
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pwd = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberMe').checked;
      const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "[]");
      const user = users.find(u => u.email === email && u.passwordHash === simpleHash(pwd));
      
      if(user) {
        currentUser = user;
        if(remember) saveSession(user);
        else localStorage.setItem(STORAGE_SESSION, JSON.stringify({ userId: user.id, email: user.email, name: user.name }));
        loadUserPrefs();
        showMainApp();
        renderHome();
        showToast(`Welcome back, ${user.name}! ✨`);
      } else {
        showToast("❌ Email atau password salah");
      }
    });
    
    document.getElementById('gotoRegisterBtn').addEventListener('click', (e) => {
      e.preventDefault();
      showRegister();
    });
  }

  function renderRegister() {
    const container = document.getElementById('registerScreen');
    container.innerHTML = `
      <div class="auth-container">
        <div class="card p-4 w-100 border-0" style="border-radius: 48px;">
          <button id="backToLoginBtn" class="btn btn-sm rounded-pill border-0 mb-3" style="width: fit-content; background: rgba(0,0,0,0.05);">
            <i class="bi bi-arrow-left"></i> Kembali ke Login
          </button>
          <h2 class="fw-bold">Join the Vibe</h2>
          <p class="text-secondary">Discover Solo's best cafes ✨</p>
          <form id="registerForm">
            <div class="mb-2">
              <label>Nama Lengkap</label>
              <input type="text" class="form-control rounded-pill" id="regName" placeholder="Masukkan namamu" required>
            </div>
            <div class="mb-2">
              <label>Email</label>
              <input type="email" class="form-control rounded-pill" id="regEmail" placeholder="email@example.com" required>
            </div>
            <div class="mb-3">
              <label>Password (min 6 karakter)</label>
              <input type="password" class="form-control rounded-pill" id="regPassword" placeholder="******" required>
            </div>
            <button type="submit" class="btn-electric w-100">Daftar & vibe 🚀</button>
          </form>
        </div>
      </div>
    `;
    
    document.getElementById('backToLoginBtn').addEventListener('click', (e) => {
      e.preventDefault();
      showLogin();
    });
    
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pwd = document.getElementById('regPassword').value;
      
      if(pwd.length < 6) { showToast("Password minimal 6 karakter"); return; }
      if(!email.includes('@')) { showToast("Email tidak valid"); return; }
      if(name.length === 0) { showToast("Nama tidak boleh kosong"); return; }
      
      let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "[]");
      if(users.find(u => u.email === email)) { showToast("Email sudah terdaftar"); return; }
      
      const newUser = {
        id: Date.now().toString(),
        name: name,
        email: email,
        passwordHash: simpleHash(pwd),
        vibeStats: { nugas: 60, deepTalk: 30, party: 10 }
      };
      users.push(newUser);
      localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
      currentUser = newUser;
      saveSession(newUser);
      loadUserPrefs();
      showMainApp();
      renderHome();
      showToast(`Selamat datang, ${name}! 🎉`);
    });
  }

  // ==================== CAFE DETAIL ====================
  function renderCafeDetail(cafe) {
    showScreen('cafeDetailScreen');
    const container = document.getElementById('cafeDetailScreen');
    const liked = isLiked(cafe.id);
    
    container.innerHTML = `
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <button id="backFromDetailBtn" class="btn btn-sm rounded-pill border-0 bg-white bg-opacity-50">
          <i class="bi bi-arrow-left"></i> Back
        </button>
        <div class="like-btn ${liked ? 'liked' : ''}" data-cafe-id="${cafe.id}">
          <i class="bi ${liked ? 'bi-heart-fill' : 'bi-heart'} fs-3"></i>
        </div>
      </div>
      <div class="card bento-card p-0 overflow-hidden">
        <img src="${cafe.image}" class="cafe-img" style="height: 200px;" alt="${cafe.name}">
        <div class="p-4">
          <h3 class="fw-bold">${cafe.name}</h3>
          <div class="mb-2">
            <span class="badge-vibe" style="background: ${cafe.vibe === 'nugas' ? '#86b3a2' : cafe.vibe === 'deeptalk' ? '#6c91b2' : '#f59e6b'}20">
              ${cafe.vibe === 'nugas' ? '📚 Nugas' : cafe.vibe === 'deeptalk' ? '💬 Deep Talk' : '🎉 Party'}
            </span>
          </div>
          <p class="text-secondary mb-2"><i class="bi bi-geo-alt"></i> ${cafe.location}</p>
          <a href="${cafe.mapsUrl}" target="_blank" class="maps-link text-primary mb-3 d-inline-block">
            <i class="bi bi-map"></i> Buka di Google Maps
          </a>
          <p>${cafe.description}</p>
          <h5 class="mt-4 mb-3"><i class="bi bi-building"></i> Fasilitas</h5>
          <div class="row g-2 mb-4">
            <div class="col-6">${cafe.facilities.wifi}</div>
            <div class="col-6">${cafe.facilities.outlet}</div>
            <div class="col-6">${cafe.facilities.mushola}</div>
            <div class="col-6">${cafe.facilities.noise}</div>
            <div class="col-6">${cafe.facilities.clean}</div>
            <div class="col-6">Staf: ${cafe.facilities.staff}</div>
          </div>
          <button id="selectCafeBtn" class="btn-electric w-100">Pilih Cafe Ini & Mulai Pesan</button>
        </div>
      </div>
    `;
    
    document.getElementById('backFromDetailBtn').addEventListener('click', () => renderHome());
    document.getElementById('selectCafeBtn').addEventListener('click', () => {
      selectedCafe = cafe;
      savePrefs();
      renderHome();
      showToast(`${cafe.name} dipilih! ✨`);
    });
    
    document.querySelector('.like-btn').addEventListener('click', () => {
      toggleLike(cafe.id);
      renderCafeDetail(cafe);
    });
  }

  // ==================== RENDER HOME ====================
  function renderHome() {
    showScreen('homeScreen');
    const container = document.getElementById('homeScreen');
    const filteredCafes = cafesData.filter(c => c.vibe === activeMoodFilter);
    const totalMenuPrice = cartItems.reduce((sum, i) => sum + i.price, 0);
    const taxRate = selectedCafe?.taxRate || 0.11;
    const serviceCharge = selectedCafe?.serviceCharge || 0.05;
    const tax = totalMenuPrice * taxRate;
    const service = totalMenuPrice * serviceCharge;
    const grandTotal = totalMenuPrice + tax + service;
    const likedCafes = getLikedCafes();
    
    container.innerHTML = `
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <h3 class="fw-bold">👋 Hey, ${currentUser.name.split(' ')[0]}!</h3>
        <button id="darkModeToggleBtn" class="btn btn-sm rounded-pill border-0 bg-white bg-opacity-50">
          <i class="bi bi-moon-stars"></i>
        </button>
      </div>
      
      ${selectedCafe ? `
        <div class="card bento-card p-3 mb-4" style="background: linear-gradient(135deg, #1e5af7, #0a44cc); color: white;">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <small class="opacity-75">Sedang di</small>
              <h5 class="fw-bold mb-0">${selectedCafe.name}</h5>
            </div>
            <button id="changeCafeBtn" class="btn btn-sm btn-light rounded-pill">Ganti</button>
          </div>
        </div>
      ` : `
        <div class="card bento-card p-3 mb-4 text-center">
          <p class="mb-0">Pilih cafe dulu yuk! ✨</p>
        </div>
      `}
      
      <div class="d-flex gap-2 mb-4 overflow-auto pb-2">
        <div class="vibe-filter ${activeMoodFilter === 'nugas' ? 'active' : ''}" data-mood="nugas">📚 Nugas</div>
        <div class="vibe-filter ${activeMoodFilter === 'deeptalk' ? 'active' : ''}" data-mood="deeptalk">💬 Deep Talk</div>
        <div class="vibe-filter ${activeMoodFilter === 'party' ? 'active' : ''}" data-mood="party">🎉 Party</div>
      </div>
      
      <h5 class="mb-3">✨ Rekomendasi Cafe Solo Raya</h5>
      <div class="row g-3 mb-4" id="cafeList">
        ${filteredCafes.map(c => `
          <div class="col-12">
            <div class="card bento-card cafe-card ${selectedCafe?.id === c.id ? 'selected' : ''}" data-cafe-id="${c.id}">
              <img src="${c.image}" class="cafe-img" alt="${c.name}">
              <div class="p-3">
                <div class="d-flex justify-content-between">
                  <h6 class="fw-bold mb-1">${c.name}</h6>
                  <div class="like-btn ${likedCafes.includes(c.id) ? 'liked' : ''}" data-cafe-id="${c.id}">
                    <i class="bi ${likedCafes.includes(c.id) ? 'bi-heart-fill' : 'bi-heart'}"></i>
                  </div>
                </div>
                <small class="text-secondary"><i class="bi bi-geo-alt"></i> ${c.location.split(',')[0]}</small>
                <div class="mt-2 d-flex gap-2 flex-wrap">
                  <small>${c.facilities.wifi}</small>
                  <small>${c.facilities.outlet}</small>
                </div>
                <button class="btn btn-sm btn-outline-electric w-100 mt-2 view-detail-btn" data-cafe-id="${c.id}">Lihat Detail</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      
      <div class="card p-3 mb-4 bento-card">
        <h5 class="mb-3"><i class="bi bi-receipt"></i> Transparansi Harga</h5>
        ${selectedCafe ? `
          <div class="mb-3">
            <select class="form-select rounded-pill" id="menuSelect">
              ${selectedCafe.menu.map(item => `<option value="${item.name}|${item.price}">${item.name} - Rp ${item.price.toLocaleString()}</option>`).join('')}
            </select>
            <button id="addItemBtn" class="btn-electric w-100 mt-2">+ Tambah Pesanan</button>
          </div>
          <div id="cartList"></div>
          <hr>
          <div class="d-flex justify-content-between"><span>Subtotal</span><span>Rp ${totalMenuPrice.toLocaleString()}</span></div>
          <div class="d-flex justify-content-between"><span>Pajak ${(taxRate*100)}%</span><span>Rp ${tax.toLocaleString()}</span></div>
          <div class="d-flex justify-content-between"><span>Service ${(serviceCharge*100)}%</span><span>Rp ${service.toLocaleString()}</span></div>
          <div class="d-flex justify-content-between fw-bold fs-5 mt-2"><span>Total</span><span>Rp ${grandTotal.toLocaleString()}</span></div>
          <button id="splitBillBtn" class="btn-outline-electric w-100 mt-3" ${cartItems.length === 0 ? 'disabled' : ''}>Split Bill & Simpan ke History</button>
        ` : '<p class="text-center py-3 text-secondary">Pilih cafe untuk mulai pesan ✨</p>'}
      </div>
    `;
    
    // Cart rendering
    if(selectedCafe && document.getElementById('cartList')) {
      const cartDiv = document.getElementById('cartList');
      if(cartItems.length === 0) cartDiv.innerHTML = '<div class="text-center text-secondary py-2">Belum ada pesanan</div>';
      else {
        cartDiv.innerHTML = cartItems.map((item, idx) => `
          <div class="d-flex justify-content-between border-bottom py-2">
            <span>${item.name}</span>
            <span>Rp ${item.price.toLocaleString()} <i class="bi bi-trash3 text-danger" style="cursor:pointer" data-index="${idx}"></i></span>
          </div>
        `).join('');
        document.querySelectorAll('.bi-trash3').forEach(el => {
          el.addEventListener('click', (e) => {
            cartItems.splice(parseInt(el.dataset.index), 1);
            savePrefs();
            renderHome();
          });
        });
      }
    }
    
    document.getElementById('addItemBtn')?.addEventListener('click', () => {
      const val = document.getElementById('menuSelect').value;
      const [name, priceStr] = val.split('|');
      cartItems.push({ name, price: parseInt(priceStr) });
      savePrefs();
      renderHome();
    });
    
    document.getElementById('splitBillBtn')?.addEventListener('click', () => {
      if(cartItems.length === 0) return showToast("Tambah pesanan dulu!");
      const total = cartItems.reduce((s, i) => s + i.price, 0);
      const tax = total * (selectedCafe?.taxRate || 0.11);
      const service = total * (selectedCafe?.serviceCharge || 0.05);
      const grandTotal = total + tax + service;
      showSplitBottomSheet(grandTotal, () => {
        addToHistory({ cafeName: selectedCafe.name, items: [...cartItems], total: grandTotal, date: new Date().toLocaleString() });
        cartItems = [];
        savePrefs();
        renderHome();
      });
    });
    
    document.getElementById('changeCafeBtn')?.addEventListener('click', () => {
      selectedCafe = null;
      cartItems = [];
      savePrefs();
      renderHome();
    });
    
    document.querySelectorAll('.cafe-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if(!e.target.classList.contains('view-detail-btn') && !e.target.closest('.like-btn')) {
          const cafe = cafesData.find(c => c.id === parseInt(card.dataset.cafeId));
          if(cafe) { selectedCafe = cafe; cartItems = []; savePrefs(); renderHome(); showToast(`${cafe.name} dipilih!`); }
        }
      });
    });
    
    document.querySelectorAll('.view-detail-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cafe = cafesData.find(c => c.id === parseInt(btn.dataset.cafeId));
        if(cafe) renderCafeDetail(cafe);
      });
    });
    
    document.querySelectorAll('.like-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLike(parseInt(btn.dataset.cafeId));
        renderHome();
      });
    });
    
    document.querySelectorAll('.vibe-filter').forEach(btn => {
      btn.addEventListener('click', () => { activeMoodFilter = btn.dataset.mood; savePrefs(); renderHome(); });
    });
    
    document.getElementById('darkModeToggleBtn')?.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      savePrefs();
    });
  }
  
  // ==================== LIKES SCREEN ====================
  function renderLikes() {
    showScreen('likesScreen');
    const container = document.getElementById('likesScreen');
    const likedIds = getLikedCafes();
    const likedCafes = cafesData.filter(c => likedIds.includes(c.id));
    
    container.innerHTML = `
      <h4 class="fw-bold mb-3"><i class="bi bi-heart-fill text-danger"></i> Cafe Favoritmu</h4>
      ${likedCafes.length === 0 ? `
        <div class="card bento-card p-5 text-center">
          <i class="bi bi-heart fs-1 text-secondary"></i>
          <p class="mt-3">Belum ada cafe favorit. Yuk like cafe yang kamu suka! ✨</p>
        </div>
      ` : `
        <div class="row g-3">
          ${likedCafes.map(c => `
            <div class="col-12">
              <div class="card bento-card p-2">
                <div class="d-flex gap-3">
                  <img src="${c.image}" style="width: 80px; height: 80px; border-radius: 20px; object-fit: cover;">
                  <div class="flex-grow-1">
                    <h6 class="fw-bold mb-1">${c.name}</h6>
                    <small class="text-secondary">${c.location.split(',')[0]}</small>
                    <div class="mt-2">
                      <button class="btn btn-sm btn-outline-electric view-like-detail" data-id="${c.id}">Lihat Detail</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    `;
    
    document.querySelectorAll('.view-like-detail').forEach(btn => {
      btn.addEventListener('click', () => {
        const cafe = cafesData.find(c => c.id === parseInt(btn.dataset.id));
        if(cafe) renderCafeDetail(cafe);
      });
    });
  }
  
  // ==================== HISTORY SCREEN ====================
  function renderHistory() {
    showScreen('historyScreen');
    const container = document.getElementById('historyScreen');
    const history = getHistory();
    
    container.innerHTML = `
      <h4 class="fw-bold mb-3"><i class="bi bi-clock-history"></i> Riwayat Transaksi</h4>
      ${history.length === 0 ? `
        <div class="card bento-card p-5 text-center">
          <i class="bi bi-receipt fs-1 text-secondary"></i>
          <p class="mt-3">Belum ada riwayat. Yuk split bill dan transaksi akan tersimpan! ✨</p>
        </div>
      ` : `
        ${history.map(h => `
          <div class="card bento-card p-3 mb-3 history-card">
            <div class="d-flex justify-content-between">
              <h6 class="fw-bold">${h.cafeName}</h6>
              <small class="text-secondary">${h.date}</small>
            </div>
            <div class="mt-2">
              ${h.items.map(item => `<div class="d-flex justify-content-between small"><span>${item.name}</span><span>Rp ${item.price.toLocaleString()}</span></div>`).join('')}
            </div>
            <hr class="my-2">
            <div class="d-flex justify-content-between fw-bold">
              <span>Total</span>
              <span>Rp ${h.total.toLocaleString()}</span>
            </div>
          </div>
        `).join('')}
      `}
    `;
  }
  
  // ==================== PROFILE SCREEN ====================
  function renderProfile() {
    showScreen('profileScreen');
    const container = document.getElementById('profileScreen');
    const stats = currentUser.vibeStats || { nugas: 0, deepTalk: 0, party: 0 };
    
    container.innerHTML = `
      <div class="card bento-card p-4">
        <h4 class="mb-3"><i class="bi bi-person-circle"></i> Profile</h4>
        <canvas id="vibeChart" height="150"></canvas>
        <hr>
        <div class="mb-3">
          <label class="form-label">Nama</label>
          <input type="text" id="editName" class="form-control rounded-pill" value="${currentUser.name}">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="editEmail" class="form-control rounded-pill" value="${currentUser.email}">
        </div>
        <button id="saveProfileBtn" class="btn-electric w-100">Simpan</button>
        <button id="logoutBtn" class="btn-outline-electric w-100 mt-2">Logout</button>
      </div>
    `;
    
    const ctx = document.getElementById('vibeChart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: { labels: ['Nugas', 'Deep Talk', 'Party'], datasets: [{ data: [stats.nugas, stats.deepTalk, stats.party], backgroundColor: ['#86b3a2', '#6c91b2', '#f59e6b'] }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
    });
    
    document.getElementById('saveProfileBtn').addEventListener('click', () => {
      currentUser.name = document.getElementById('editName').value;
      currentUser.email = document.getElementById('editEmail').value;
      updateUser(currentUser);
      showToast("Profil diupdate!");
      renderProfile();
    });
    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearSession();
      currentUser = null;
      showLogin();
    });
  }
  
  function showSplitBottomSheet(total, onConfirm) {
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal fade';
    modalDiv.innerHTML = `
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-3" style="border-radius: 32px;">
          <div class="modal-header border-0">
            <h5 class="modal-title">👥 Split Bill</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label>Jumlah orang</label>
            <input type="number" id="splitCount" class="form-control rounded-pill" value="2" min="1">
            <div class="mt-3 p-3 bg-light rounded-4 text-center">
              <span>Per orang:</span>
              <div class="fs-3 fw-bold" id="perPerson">Rp ${(total/2).toLocaleString()}</div>
            </div>
            <button id="confirmSplitBtn" class="btn-electric w-100 mt-3">Simpan ke History</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modalDiv);
    const modal = new bootstrap.Modal(modalDiv);
    modal.show();
    
    document.getElementById('splitCount').addEventListener('input', () => {
      const cnt = parseInt(document.getElementById('splitCount').value) || 1;
      document.getElementById('perPerson').innerText = `Rp ${(total/cnt).toLocaleString()}`;
    });
    document.getElementById('confirmSplitBtn').addEventListener('click', () => {
      onConfirm();
      modal.hide();
      showToast("✅ Transaksi tersimpan di History!");
      modalDiv.remove();
    });
    modalDiv.addEventListener('hidden.bs.modal', () => modalDiv.remove());
  }
  
  // ==================== INIT ====================
  function initApp() {
    initUsers();
    const user = getCurrentUser();
    if(user) {
      currentUser = user;
      loadUserPrefs();
      showMainApp();
      renderHome();
    } else {
      showLogin();
    }
    
    // Bottom nav listeners
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        const nav = item.dataset.nav;
        if(nav === 'home') renderHome();
        else if(nav === 'likes') renderLikes();
        else if(nav === 'history') renderHistory();
        else if(nav === 'profile') renderProfile();
      });
    });
  }
  
  window.initApp = initApp;
  initApp();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
  if('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response("Vibe Check - Offline"))));`;
    const blob = new Blob([swCode], {type: 'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.log);
  }
</script>
</body>
</html>
